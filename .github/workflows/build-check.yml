name: CI — Build Check

# Kiedy odpala się ten workflow:
# - przy każdym push na dowolny branch
# - przy każdym otwarciu lub aktualizacji PR do maina
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Build backendu (.NET 10)
  # ─────────────────────────────────────────
  build-backend:
    name: Build Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      # Krok 1 — Pobierz kod z repo
      - name: Checkout kodu
        uses: actions/checkout@v4

      # Krok 2 — Zainstaluj .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Krok 3 — Cache paczek NuGet (przyspiesza kolejne uruchomienia)
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Krok 4 — Przywróć paczki NuGet
      - name: Restore paczek NuGet
        run: dotnet restore CvTracker.Api/CvTracker.Api.csproj

      # Krok 5 — Zbuduj projekt
      # --no-restore bo już zrobiliśmy restore w kroku 4
      # --configuration Release bo chcemy sprawdzić build produkcyjny
      - name: Build backendu
        run: dotnet build CvTracker.Api/CvTracker.Api.csproj --no-restore --configuration Release

  # ─────────────────────────────────────────
  # JOB 2 — Build frontendu (React + Vite)
  # ─────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      # Krok 1 — Pobierz kod z repo
      - name: Checkout kodu
        uses: actions/checkout@v4

      # Krok 2 — Zainstaluj Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CvTracker.Client/package-lock.json

      # Krok 3 — Zainstaluj zależności npm
      # ci zamiast install — szybsze, deterministyczne, idealne dla CI
      - name: Instalacja zależności npm
        run: npm ci
        working-directory: CvTracker.Client

      # Krok 4 — Zbuduj frontend
      # Vite produkuje folder dist/ z gotowym buildem
      - name: Build frontendu
        run: npm run build
        working-directory: CvTracker.Client